<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #2f3941;
      background: #fff;
      padding: 12px;
    }

    .result-box {
      border: 1px solid #d8dcde;
      border-radius: 4px;
      padding: 8px 10px;
      min-height: 44px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #2f3941;
      background: #f8f9f9;
      word-break: break-word;
    }
    .result-box.placeholder { color: #68737d; font-style: italic; }
    .result-box.generated   { background: #edf7ff; border-color: #adcce4; font-weight: 500; }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    button {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-generate { background: #1f73b7; color: #fff; }
    .btn-generate:hover:not(:disabled) { background: #1a62a0; }

    .btn-apply { background: #228f67; color: #fff; }
    .btn-apply:hover:not(:disabled) { background: #1b7a58; }

    .status {
      font-size: 11px;
      color: #68737d;
      min-height: 16px;
      text-align: center;
    }
    .status.error   { color: #cc3340; }
    .status.success { color: #228f67; }
    .status.warning { color: #ad5700; }

    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 10px;
      color: #c2c8cc;
    }
    .footer a {
      color: #c2c8cc;
      text-decoration: none;
    }
    .footer a:hover { color: #68737d; }

    .spinner {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="resultBox" class="result-box placeholder">Subject will appear here…</div>

  <div class="btn-row">
    <button id="generateBtn" class="btn-generate">Generate</button>
    <button id="applyBtn"    class="btn-apply" disabled>Apply</button>
  </div>

  <div id="status" class="status"></div>
  <div class="footer">by <a href="https://tat.rocks" target="_blank">tat.rocks</a></div>

  <!-- Sentry — fill SENTRY_DSN below to enable error monitoring -->
  <script src="https://browser.sentry-cdn.com/8.28.0/bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
  <script>
    // ── Sentry ────────────────────────────────────────────────
    // Create a free project at sentry.io and paste your DSN here
    const SENTRY_DSN = '';
    if (SENTRY_DSN && window.Sentry) {
      Sentry.init({ dsn: SENTRY_DSN, release: 'subzen@1.1.0' });
    }

    function captureError(err, context) {
      if (window.Sentry && SENTRY_DSN) {
        Sentry.captureException(err, { extra: context });
      }
    }

    // ── Config ────────────────────────────────────────────────
    const PROXY_URL   = 'https://vsohejalrcjcimvbkbyk.supabase.co/functions/v1/subzen-proxy';
    let   PROXY_TOKEN = 'Vy1JkLEUcx2ruXILufhBk_P2OYLcyrLeFC887zAK1bI';

    const PROVIDER_DEFAULTS = {
      openai: { url: 'https://api.openai.com/v1/chat/completions',      model: 'gpt-4o-mini' },
      groq:   { url: 'https://api.groq.com/openai/v1/chat/completions', model: 'llama-3.1-8b-instant' }
    };

    let fallbackLanguage = 'en';
    let autoApply        = false;
    let forceLanguage    = false;
    let aiProvider       = '';
    let aiApiKey         = '';
    let generatedSubject = null;

    const client      = ZAFClient.init();
    const generateBtn = document.getElementById('generateBtn');
    const applyBtn    = document.getElementById('applyBtn');
    const resultBox   = document.getElementById('resultBox');
    const statusEl    = document.getElementById('status');

    // ── Helpers ───────────────────────────────────────────────

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className   = 'status' + (type ? ' ' + type : '');
    }

    function setLoading(on) {
      generateBtn.disabled  = on;
      generateBtn.innerHTML = on
        ? '<span class="spinner"></span>Generating…'
        : 'Generate';
    }

    function showSubject(text) {
      generatedSubject      = text;
      resultBox.textContent = text;
      resultBox.className   = 'result-box generated';
      applyBtn.disabled     = false;
    }

    function resetResult() {
      generatedSubject      = null;
      resultBox.textContent = 'Subject will appear here…';
      resultBox.className   = 'result-box placeholder';
      applyBtn.disabled     = true;
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    function buildPrompt(description) {
      const langInstruction = forceLanguage
        ? `You MUST respond in "${fallbackLanguage}" language.`
        : `Detect the language of the description and respond in that language. If uncertain, use "${fallbackLanguage}".`;
      return `Generate a concise ticket subject (max 8 words). ${langInstruction} Reply with ONLY the subject, no quotes, no punctuation at the end.\n\nTicket:\n${description}`;
    }

    function friendlyError(status, message) {
      if (status === 429) return 'Too many requests — service busy. Please wait and try again.';
      if (status === 401) return 'Invalid API key. Check your settings.';
      if (status === 403) return 'Access denied. Check your API key permissions.';
      if (status >= 500) return 'AI service is temporarily unavailable. Try again in a moment.';
      return message || 'Unexpected error. Please try again.';
    }

    // ── API calls ─────────────────────────────────────────────

    async function callProxy(description) {
      const res  = await fetch(PROXY_URL, {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': 'Bearer ' + PROXY_TOKEN
        },
        body: JSON.stringify({ description, fallback: fallbackLanguage, force: forceLanguage })
      });
      const data = await res.json();
      if (!res.ok) {
        const err = new Error(friendlyError(res.status, data.error));
        err.status = res.status;
        throw err;
      }
      return data.subject;
    }

    async function callDirect(description) {
      const cfg = PROVIDER_DEFAULTS[aiProvider];
      if (!cfg) throw new Error('Unknown provider "' + aiProvider + '". Use "openai" or "groq".');

      const res  = await fetch(cfg.url, {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': 'Bearer ' + aiApiKey
        },
        body: JSON.stringify({
          model:      cfg.model,
          max_tokens: 60,
          messages:   [{ role: 'user', content: buildPrompt(description) }]
        })
      });
      const data = await res.json();
      if (!res.ok) {
        const err = new Error(friendlyError(res.status, data.error?.message));
        err.status = res.status;
        throw err;
      }
      return (data.choices[0].message.content || '').trim().replace(/^["']|["']$/g, '');
    }

    // ── Generate with retry ───────────────────────────────────

    async function generateSubject(description) {
      const usingDirect  = aiApiKey && PROVIDER_DEFAULTS[aiProvider];
      const MAX_RETRIES  = 2;

      for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
        try {
          return usingDirect
            ? await callDirect(description)
            : await callProxy(description);

        } catch (e) {
          const isRateLimit = e.status === 429;

          if (isRateLimit && attempt < MAX_RETRIES) {
            const wait = 4 * (attempt + 1);
            setStatus(`Service busy — retrying in ${wait}s… (${attempt + 1}/${MAX_RETRIES})`);
            await sleep(wait * 1000);
            continue;
          }

          captureError(e, {
            provider: usingDirect ? aiProvider : 'proxy',
            attempt,
            status: e.status
          });
          throw e;
        }
      }
    }

    // ── Core flow ─────────────────────────────────────────────

    async function runGenerate(silent = false) {
      setLoading(true);
      resetResult();
      setStatus('');

      try {
        const data        = await client.get('ticket.description');
        const description = (data['ticket.description'] || '').trim();

        if (description.length < 10) {
          if (!silent) setStatus('The ticket has no description yet.', 'error');
          return;
        }

        const subject = await generateSubject(description);
        showSubject(subject);

        // Remind user about shared service limits after success
        if (!aiApiKey) {
          setStatus('Using shared service · add your own API key in settings for best results', 'warning');
        }

      } catch (e) {
        setStatus(e.message, 'error');
      } finally {
        setLoading(false);
      }
    }

    async function runApply() {
      if (!generatedSubject) return;
      try {
        await client.set('ticket.subject', generatedSubject);
        applyBtn.disabled = true;
        setStatus('✓ Subject applied!', 'success');
      } catch (e) {
        setStatus('Could not apply: ' + e.message, 'error');
        captureError(e, { action: 'apply' });
      }
    }

    // ── Init ──────────────────────────────────────────────────

    client.on('app.registered', async () => {
      try {
        const metadata   = await client.metadata();
        const s          = metadata.settings || {};
        autoApply        = s.autoApply === true || s.autoApply === 'true';
        fallbackLanguage = (s.fallback_en_es_fr_it_zh || 'en').toLowerCase();
        forceLanguage    = s.forceLanguage === true || s.forceLanguage === 'true';
        aiProvider       = (s.ai_provider || '').toLowerCase().trim();
        aiApiKey         = (s.ai_api_key  || '').trim();

        if (!aiApiKey) {
          setStatus('Using shared service · may have delays during peak hours', 'warning');
        }

        if (autoApply) {
          const statusData = await client.get('ticket.status');
          if (statusData['ticket.status'] === 'new') {
            await runGenerate(true);
            if (generatedSubject) await runApply();
          }
        }

      } catch (e) {
        setStatus('Init error: ' + e.message, 'error');
        captureError(e, { action: 'init' });
      }

      client.invoke('resize', { width: '100%', height: '160px' });
    });

    // ── Events ────────────────────────────────────────────────

    generateBtn.addEventListener('click', runGenerate);
    applyBtn.addEventListener('click',    runApply);
  </script>
</body>
</html>
